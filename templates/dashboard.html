<!doctype html>
<html><head><meta charset="utf-8"><title>Smart Store Dashboard</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px} .cards{display:flex;gap:16px;flex-wrap:wrap}.card{border:1px solid #ddd;border-radius:10px;padding:20px;min-width:180px}.muted{color:#666}</style></head>
<body><h1>Smart Store Inventory Analytics</h1><p class="muted">Django inventory, sales and analytics application.</p><div class="cards"><div class="card"><b>Products</b><h2 id="products">—</h2></div><div class="card"><b>Units in stock</b><h2 id="stock">—</h2></div><div class="card"><b>Sales</b><h2 id="sales">—</h2></div><div class="card"><b>Reorder alerts</b><h2 id="alerts">—</h2></div></div><script>fetch('/api/analytics/summary/').then(r=>r.json()).then(d=>{products.textContent=d.product_count;stock.textContent=d.units_in_stock;sales.textContent=d.sales_count;alerts.textContent=d.reorder_alerts.length}).catch(()=>{});</script></body></html>
